name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', 'snapshot']
    env:
      # The Makefile derives every dependency directory from these two roots.
      FORKS_DIR: ${{ github.workspace }}/../deps
      STRAIGHT_REPOS: ${{ github.workspace }}/../deps
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      # Heads, no pins: an agent-shell fork rebase should show breakage here.
      - name: Clone dependencies
        run: |
          git clone --depth 1 --branch main https://github.com/liaowang11/agent-shell "$FORKS_DIR/agent-shell"
          git clone --depth 1 https://github.com/liaowang11/acp.el "$FORKS_DIR/acp"
          git clone --depth 1 https://github.com/xenodium/shell-maker "$FORKS_DIR/shell-maker"
          git clone --depth 1 https://github.com/jrblevin/markdown-mode "$FORKS_DIR/markdown-mode"
          git clone --depth 1 https://github.com/magit/magit "$FORKS_DIR/magit"
          git clone --depth 1 https://github.com/magit/transient "$FORKS_DIR/transient"
          git clone --depth 1 https://github.com/magit/with-editor "$FORKS_DIR/with-editor"
          git clone --depth 1 https://github.com/tarsius/llama "$FORKS_DIR/llama"
          git clone --depth 1 https://github.com/emacs-compat/compat "$FORKS_DIR/compat"
          git clone --depth 1 https://github.com/tarsius/cond-let "$FORKS_DIR/cond-let"

      - name: make check
        run: make check
